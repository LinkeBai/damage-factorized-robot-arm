version: g2_dfwm_ood_v1
dof: 5
task: push
damages: [D2, D3]
calibration_shots: [0, 1, 2, 5]

# DFWM-OOD 核心设计：
# 训练只见 nominal + weak_motor（2种物理）
# 测试遇到 high_damping + delay_1（从未见过的物理）
# 这给 z_residual 一个真正需要它的场景

train:
  - [intact, nominal]
  - [intact, weak_motor]
  - [D2, nominal]
  - [D2, weak_motor]
  - [D3, nominal]
  - [D3, weak_motor]

validation:
  - [D2, noisy_deadband]
  - [D3, noisy_deadband]

# 测试：OOD 物理，普通集成未见过
test:
  - [D2, high_damping]
  - [D2, delay_1]
  - [D3, high_damping]
  - [D3, delay_1]
