# Audit-only expansion for the frozen IPWM checkpoint.
# D3 remains absent from training and validation; no result from this split may
# be used to tune the model, context rule, adapter, or paper gate.
version: g2_ipwm_d3_physics_spectrum_audit_v1
dof: 5
task: push
calibration_shots: [0]
train:
  - [intact, nominal]
  - [intact, weak_motor]
  - [intact, high_damping]
  - [intact, delay_1]
  - [D1, nominal]
  - [D1, high_damping]
  - [D1, delay_1]
  - [D1, noisy_deadband]
  - [D2, nominal]
  - [D2, high_damping]
  - [D2, delay_1]
  - [D2, noisy_deadband]
  - [D4, nominal]
  - [D4, high_damping]
  - [D4, delay_1]
  - [D4, noisy_deadband]
  - [D5, nominal]
  - [D5, high_damping]
  - [D5, delay_1]
  - [D5, noisy_deadband]
validation:
  - [D1, weak_motor]
  - [D2, weak_motor]
  - [D4, weak_motor]
  - [D5, weak_motor]
  - [intact, noisy_deadband]
test:
  - [D3, nominal]
  - [D3, weak_motor]
  - [D3, high_damping]
  - [D3, delay_1]
  - [D3, noisy_deadband]
  - [D3, mixed_composition]
  - [D3, mixed_unseen]
