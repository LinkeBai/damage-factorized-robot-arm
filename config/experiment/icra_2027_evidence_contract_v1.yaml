version: icra_2027_evidence_contract_v1
status: frozen_before_new_confirmation_runs_2026-08-28
target_venue: IEEE_ICRA_2027_contributed_paper
score_contract:
  criterion_scale: [1, 5]
  overall_target: 4.0
  required_minimums:
    novelty: 3.5
    soundness: 4.0
    evidence: 4.0
    significance: 4.0
    clarity: 4.0
    reproducibility: 4.0
    ethics_limitations: 4.0
  fatal_rule: no_4_plus_if_task_level_claim_is_no_go_and_no_independent_external_validity_chain
  relative_progress_must_be_reported_separately: true

development:
  allowed_training_seeds: [27]
  purpose: method_and_controller_diagnosis_only
  reusable_for_confirmation: false

confirmation:
  untouched_training_seeds: [57, 67, 77, 87, 97]
  minimum_completed_training_seeds: 5
  no_hyperparameter_change_after_first_confirmation_seed: true
  trajectory_seeds_disjoint_from_training_and_development: true

evaluation_scope:
  minimum_lock_locations: 3
  minimum_physics_families: 4
  minimum_targets_per_condition: 10
  horizons: [10, 25, 50]
  required_methods:
    - nominal_or_shared_world_model
    - mechanism_matched_carrier
    - full_state_ipwm
    - selective_ipwm
    - strongest_available_robust_or_adaptive_baseline
  required_ablations:
    - no_state_isolation
    - no_physical_context
    - no_routing
    - parameter_matched_baseline

open_loop_gates:
  object_rmse_mean_improvement_over_carrier_pct_min: 5.0
  object_rmse_seed_level_positive_fraction_min: 0.8
  hierarchical_paired_bootstrap_ci_lower_bound_pct_min: 0.0
  free_joint_regression_pct_max: 0.0
  locked_coordinate_violation_rms_max: 1.0e-7

closed_loop_protocol:
  primary_metric: terminal_object_to_goal_distance_m
  invalid_metric_for_current_split: success_at_50mm
  secondary_metrics:
    - contact_steps
    - object_displacement_m
    - action_deviation
    - fallback_rate
    - planning_latency_ms
  development_gate:
    minimum_targets: 10
    mean_improvement_over_carrier_pct_min: 5.0
    paired_ci_lower_bound_pct_min: 0.0
    catastrophic_regression_fraction_max: 0.1
  confirmation_gate:
    seed_level_positive_fraction_min: 0.8
    mean_improvement_over_carrier_pct_min: 5.0
    hierarchical_paired_bootstrap_ci_lower_bound_pct_min: 0.0
  fallback_if_no_go: narrow_claim_and_do_not_count_control_as_positive_evidence

statistics:
  unit_for_training_generalization: training_seed
  unit_for_task_generalization: target_within_seed_condition
  confidence_level: 0.95
  bootstrap_draws: 20000
  report_effect_sizes_and_raw_rows: true
  do_not_treat_query_seed_as_training_seed: true

publication_integrity:
  preserve_all_no_go_results: true
  prohibit_post_hoc_gate_changes: true
  prohibit_hardware_or_sim_to_real_claim_without_hardware: true
  camera_architecture: overhead_plus_external_horizontal_neither_eye_in_hand
