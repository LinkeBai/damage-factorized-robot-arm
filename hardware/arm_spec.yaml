# arm_spec.yaml: Nominal kinematic parameters for the genkiarm kit arm.
# Initialized from genkiarm.urdf and calibrated from the real arm in G0.
# Real-arm G0 confirms five positioning joints plus one gripper-open servo.
#
# Treat this as the single source of truth for FK, IK, and MuJoCo modeling.
# arm.xml and fk.py MUST track the values below.

dof: 5
calibration_status: g0_kinematics_calibrated_dynamics_provisional

base:
  height: 0.120           # base plane -> J2 pitch axis height (m), +/- 0.005
  j1_x_offset: 0.0        # J1/J2 axis origins intersect; their axes are orthogonal

links:
  shoulder_x: 0.0          # J1 -> J2 origin translation (m); axes intersect
  upper_arm: 0.110         # J2 -> J3 vertical axis spacing (m), +/- 0.010
  forearm: 0.120           # J3 -> J4 vertical axis spacing (m), +/- 0.010
  wrist: 0.060             # J4 -> J5 vertical axis spacing (m), +/- 0.010
  tool: 0.110              # J5 disk -> gripper tip vertical spacing (m), +/- 0.010
  wrist_to_tip: 0.170      # combined J4 -> tip (m)
  j5_to_j6_y: -0.0132      # J5 -> J6 lateral offset (m)
  j5_to_j6_z: 0.110        # J5 disk -> gripper tip vertical spacing (m)
  tcp_x: 0.020             # provisional J6-axis TCP offset; G0 must measure

joints:
  - name: j1
    type: base_yaw
    axis: [0, 0, 1]
    range_deg: [-85, 85]
    range_rad: [-1.4835, 1.4835]
  - name: j2
    type: shoulder_pitch
    axis: [0, 1, 0]
    range_deg: [-85, 85]
    range_rad: [-1.4835, 1.4835]
  - name: j3
    type: elbow_pitch
    axis: [0, 1, 0]
    range_deg: [-92, 92]
    range_rad: [-1.6057, 1.6057]
  - name: j4
    type: wrist_pitch
    axis: [0, 1, 0]
    range_deg: [-94, 92]
    range_rad: [-1.6406, 1.6057]
  - name: j5
    type: wrist_roll
    axis: [0, 0, 1]
    range_deg: [-90, 90]
    range_rad: [-1.5708, 1.5708]
damage:
  lockable_joints: [j2, j3, j4]   # per plan: lock shoulder, elbow, or wrist pitch
  locking_method: servo_position_hold

source:
  urdf: genkiarm.urdf
  kinematics_lib: Control/reference/kinematics/core.py
  note: J1 base x-offset (-0.013) is set to 0 in the simplified 5-DoF model
        since it is internal to the base mounting geometry and does not
        meaningfully affect the FK chain.
